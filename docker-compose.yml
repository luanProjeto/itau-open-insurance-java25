services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: insurance
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance -d insurance"]
      interval: 5s
      timeout: 3s
      retries: 10
